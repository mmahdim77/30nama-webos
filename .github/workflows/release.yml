name: Release IPK

# Push a tag like v1.2.3 to build the .ipk and attach it to a GitHub Release.
# Run it manually (Actions > Release IPK > Run workflow) to get the .ipk as a build artifact only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v1.2.3"; exit 1; }
          node -e "const f='webos-app/appinfo.json',j=require('./'+f);j.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')" "$VER"

      - name: Package
        run: |
          ./deploy.sh package
          cp dist/*.ipk dist/30nama-webos.ipk   # stable name for releases/latest/download/30nama-webos.ipk
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: dist/*.ipk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.ipk --clobber
